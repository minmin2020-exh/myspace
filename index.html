<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>东风吹破少年梦，从此再无赤子心！</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:#000 url(https://icdn.binmt.cc/2604/69db59cbd3beb.jpeg) center/cover fixed;
  color:#fff;font-family:sans-serif;padding:20px;min-height:100vh
}
/* 粉色樱花雨 */
.sakura{
  position:fixed;top:0;left:0;width:100%;height:100%;
  pointer-events:none;z-index:999
}
.petal{
  position:absolute;
  background:#ffb6c1;
  border-radius:50% 0 50% 50%;
  opacity:0.8;
  animation:fall linear infinite
}
@keyframes fall{
  0%{transform:translateY(0) rotate(0deg)}
  100%{transform:translateY(100vh) rotate(360deg)}
}

.container{max-width:500px;margin:0 auto}
.datetime{text-align:center;margin:40px 0 24px;text-shadow:0 2px 10px #000}
.time{font-size:3.2rem;font-weight:700}
.date{font-size:1rem;opacity:.9}

.search-wrap{position:relative;margin-bottom:12px}
.search-input{
  width:100%;height:56px;background:rgba(255,255,255,.12);
  backdrop-filter:blur(6px);border:none;border-radius:30px;
  color:#fff;font-size:16px;padding:0 20px;outline:none
}

.suggest,.history{
  position:absolute;top:calc(100% + 8px);left:0;right:0;
  background:rgba(255,255,255,.15);backdrop-filter:blur(12px);
  border-radius:16px;display:none;overflow:hidden;z-index:99
}
.suggest.show,.history.show{display:block}
.item{padding:14px 20px;color:#fff;cursor:pointer;border-bottom:1px solid rgba(255,255,255,.1)}
.item:last-child{border-bottom:none}
.item:hover{background:rgba(255,255,255,.1)}

.nav{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:20px}
.nav.hide{opacity:0;transform:translateY(10px);pointer-events:none}
.link{display:flex;flex-direction:column;align-items:center;gap:6px;text-decoration:none;color:#fff;font-size:12px}
.icon{width:50px;height:50px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;background:#ff6b6b}
.link:nth-child(2) .icon{background:#4dabf7}
.link:nth-child(3) .icon{background:#51cf66}
.link:nth-child(4) .icon{background:#fab005}
</style>
</head>

<body>
<div class="sakura" id="sakura"></div>

<div class="container">
  <div class="datetime">
    <div class="time" id="time">00:00:00</div>
    <div class="date" id="date"></div>
  </div>

  <div class="search-wrap">
    <input id="search" class="search-input" placeholder="搜索一下~" autocomplete="off">
    <div class="history" id="history"></div>
    <div class="suggest" id="suggest"></div>
  </div>

  <div class="nav" id="nav">
    <a class="link" href="https://www.baidu.com"><div class="icon">百</div><span>百度</span></a>
    <a class="link" href="https://www.douyin.com"><div class="icon">抖</div><span>抖音</span></a>
    <a class="link" href="https://www.bilibili.com"><div class="icon">B</div><span>B站</span></a>
    <a class="link" href="https://www.zhihu.com"><div class="icon">知</div><span>知乎</span></a>
  </div>
</div>

<script>
// 粉色樱花雨
function createSakura(){
  const box = document.getElementById('sakura');
  const count = 50;
  for(let i=0;i<count;i++){
    const p = document.createElement('div');
    p.className = 'petal';
    const s = Math.random()*10 + 5;
    p.style.width = s+'px';
    p.style.height = s+'px';
    p.style.left = Math.random()*100+'%';
    p.style.animationDuration = (Math.random()*3+4)+'s';
    p.style.animationDelay = Math.random()*5+'s';
    box.appendChild(p);
  }
}
createSakura();

// 时间
function update(){
  const d=new Date(),w=['日','一','二','三','四','五','六'];
  document.getElementById('time').textContent=d.toTimeString().slice(0,8);
  document.getElementById('date').textContent=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,0)}-${String(d.getDate()).padStart(2,0)} 星期${w[d.getDay()]}`;
}
setInterval(update,1000);update();

const search=document.getElementById('search'),suggest=document.getElementById('suggest'),history=document.getElementById('history'),nav=document.getElementById('nav');

window.addEventListener('pageshow',()=>{
  search.value='';
  suggest.classList.remove('show');
  history.classList.remove('show');
  nav.classList.remove('hide');
});

search.addEventListener('input',()=>{
  const v=search.value.trim();
  v?nav.classList.add('hide'):nav.classList.remove('hide');
});

// 搜索后自动清空搜索框
search.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&search.value.trim()){
    window.open(`https://www.baidu.com/s?wd=${encodeURIComponent(search.value)}`);
    search.value = '';  // 搜索完清空
    nav.classList.remove('hide');
  }
});
</script>
</body>
</html>

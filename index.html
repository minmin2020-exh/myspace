<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>纯净导航</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}
body {
  background: #000 url("https://icdn.binmt.cc/2604/69db59cbd3beb.jpeg") center/cover fixed;
  color: #fff;
  font-family: system-ui, -apple-system, sans-serif;
  min-height: 100vh;
  padding: 20px;
  overflow-x: hidden;
}

/* 樱花雨容器 */
.sakura {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 99999;
}

.container {
  max-width: 500px;
  margin: 0 auto;
  position: relative;
  z-index: 2;
}

.datetime {
  text-align: center;
  margin: 40px 0 24px;
  text-shadow: 0 2px 10px rgba(0, 0, 0, .5);
}
.time {
  font-size: 3.2rem;
  font-weight: 700;
}
.date {
  font-size: 1rem;
  opacity: .9;
}

.search-wrap {
  position: relative;
  margin-bottom: 12px;
}
.search-bar {
  background: rgba(255, 255, 255, .12);
  backdrop-filter: blur(6px);
  border-radius: 30px;
  height: 56px;
}
.search-input {
  width: 100%;
  height: 100%;
  background: transparent;
  border: none;
  outline: none;
  color: #fff;
  font-size: 16px;
  padding: 0 20px;
  border-radius: 30px;
}

/* ======================================
   【核心修改】联想/历史框改为毛玻璃卡片样式
====================================== */
/* 统一联想词/历史词卡片 */
.suggest, .history-panel {
  position: absolute;
  top: calc(100% + 8px);
  left: 0;
  right: 0;
  background: rgba(255, 255, 255, 0.15);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-radius: 16px;
  overflow: hidden;
  display: none;
  z-index: 999;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
}
.suggest.show, .history-panel.show {
  display: block;
}

/* 列表项样式（和截图里一样，分割线+左对齐） */
.suggest-item, .history-item {
  padding: 14px 20px;
  color: #fff;
  font-size: 16px;
  cursor: pointer;
  transition: background 0.15s;
  border-bottom: 1px solid rgba(255, 255, 255, 0.1);
}
.suggest-item:last-child, .history-item:last-child {
  border-bottom: none;
}
.suggest-item:hover, .history-item:hover {
  background: rgba(255, 255, 255, 0.1);
}

/* 历史词右侧删除按钮 */
.history-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.history-del {
  color: rgba(255, 255, 255, 0.6);
  font-size: 18px;
  padding: 0 8px;
}
.history-del:hover {
  color: #ff6b6b;
}

/* 历史词底部“清空”按钮 */
.history-clear {
  padding: 14px;
  text-align: center;
  color: rgba(255, 255, 255, 0.6);
  font-size: 14px;
  border-top: 1px solid rgba(255, 255, 255, 0.1);
  cursor: pointer;
}
.history-clear:hover {
  background: rgba(255, 255, 255, 0.1);
}

/* 无历史提示 */
.empty-tip {
  padding: 24px;
  text-align: center;
  color: rgba(255, 255, 255, 0.5);
  font-size: 15px;
}

/* 搜索图标（可选，和截图里一样加个放大镜） */
.search-wrap::after {
  content: "🔍";
  position: absolute;
  right: 20px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 18px;
  pointer-events: none;
  opacity: 0.7;
}
.search-input {
  padding-right: 48px;
}

/* 其他原有样式 */
.nav-box {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  margin-top: 20px;
  transition: .3s ease;
}
.nav-box.hide {
  opacity: 0;
  transform: translateY(10px);
  pointer-events: none;
}
.item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  text-decoration: none;
  color: #fff;
  font-size: 12px;
  user-select: none;
  touch-action: none;
}
.icon {
  width: 50px;
  height: 50px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  font-weight: bold;
}
.add-btn {
  background: rgba(255, 255, 255, .2) !important;
  font-size: 20px !important;
  cursor: pointer;
}
.add-btn span {
  display: none;
}
.mask {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(0, 0, 0, .7);
  z-index: 9999;
  display: none;
  align-items: center;
  justify-content: center;
}
.mask.show {
  display: flex;
}
.modal {
  background: #111;
  padding: 24px;
  border-radius: 16px;
  width: 90%;
  max-width: 320px;
}
.modal input {
  width: 100%;
  padding: 12px 14px;
  margin: 8px 0;
  border-radius: 10px;
  border: none;
  background: #222;
  color: #fff;
}
.modal .btns {
  display: flex;
  gap: 10px;
  margin-top: 12px;
}
.modal button {
  flex: 1;
  padding: 10px;
  border: none;
  border-radius: 10px;
  cursor: pointer;
}
.modal .ok {
  background: #07c160;
  color: #fff;
}
.modal .cancel {
  background: #333;
  color: #fff;
}
.menu {
  position: absolute;
  background: #1a1a1a;
  border-radius: 12px;
  padding: 8px 0;
  z-index: 9999;
  min-width: 140px;
  display: none;
}
.menu.show {
  display: block;
}
.menu div {
  padding: 10px 16px;
  cursor: pointer;
}
.menu div:hover {
  background: #333;
}
.item.sorting {
  opacity: .5;
}
.item.sorting .icon {
  transform: scale(0.9);
}
.item:nth-child(4n+1) .icon { background: #ff6b6b; }
.item:nth-child(4n+2) .icon { background: #4dabf7; }
.item:nth-child(4n+3) .icon { background: #51cf66; }
.item:nth-child(4n+4) .icon { background: #fab005; }
</style>
</head>
<body>

<!-- 樱花雨容器 -->
<div class="sakura" id="sakura"></div>

<!-- 历史记录面板 -->
<div class="history-panel" id="historyPanel">
  <div id="historyList"></div>
  <div class="history-clear" onclick="clearAllHistory()">清空全部历史</div>
</div>

<!-- 联想词面板 -->
<div class="suggest" id="suggest"></div>

<!-- 弹窗 -->
<div class="mask" id="addMask">
  <div class="modal">
    <input id="addName" placeholder="名称">
    <input id="addUrl" placeholder="网址">
    <div class="btns">
      <button class="cancel" onclick="closeAdd()">取消</button>
      <button class="ok" onclick="saveAdd()">添加</button>
    </div>
  </div>
</div>
<div class="mask" id="editMask">
  <div class="modal">
    <input id="editName" placeholder="名称">
    <input id="editUrl" placeholder="网址">
    <div class="btns">
      <button class="cancel" onclick="closeEdit()">取消</button>
      <button class="ok" onclick="saveEdit()">保存</button>
    </div>
  </div>
</div>

<div class="menu" id="longMenu">
  <div onclick="startSort()">排序</div>
  <div onclick="openEdit()">编辑</div>
  <div onclick="doDel()" style="color:#ff4444">删除</div>
</div>

<div class="container">
  <div class="datetime">
    <div class="time" id="time">00:00:00</div>
    <div class="date" id="date">2026-04-12 星期日</div>
  </div>

  <div class="search-wrap">
    <div class="search-bar">
      <input type="text" id="searchInput" class="search-input" placeholder="搜索一下~" autocomplete="off">
    </div>
  </div>

  <div class="nav-box" id="navBox"></div>
</div>

<script>
// 樱花雨特效
function createSakura() {
  const sakura = document.getElementById('sakura');
  const count = 50;
  for (let i = 0; i < count; i++) {
    const div = document.createElement('div');
    const size = Math.random() * 15 + 5;
    div.style.cssText = `
      position:absolute;
      top:-20px;
      left:${Math.random()*100}%;
      width:${size}px;
      height:${size}px;
      background:#ffb6c1;
      border-radius:100% 0 100% 0;
      opacity:${Math.random()*0.8+0.2};
      transform:rotate(${Math.random()*360}deg);
      animation:fall ${Math.random()*5+5}s linear infinite;
      animation-delay:-${Math.random()*5}s;
    `;
    sakura.appendChild(div);
  }
}
const style = document.createElement('style');
style.innerHTML = `
  @keyframes fall{
    0%{transform:translateY(0) rotate(0deg)}
    100%{transform:translateY(100vh) rotate(360deg)}
  }
`;
document.head.appendChild(style);
createSakura();

// 时间
function updateDateTime() {
  const now = new Date();
  const w = ['日', '一', '二', '三', '四', '五', '六'];
  document.getElementById('time').textContent = now.toTimeString().slice(0, 8);
  document.getElementById('date').textContent = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')} 星期${w[now.getDay()]}`;
}
setInterval(updateDateTime, 1000);
updateDateTime();

// 搜索相关
const search = document.getElementById('searchInput');
const suggest = document.getElementById('suggest');
const historyPanel = document.getElementById('historyPanel');
const historyList = document.getElementById('historyList');
const nav = document.getElementById('navBox');
let timer;

// 页面返回清空
window.addEventListener('pageshow', () => {
  search.value = '';
  hideHistory();
  hideSuggest();
  nav.classList.remove('hide');
});

// 历史记录
function getSearchHistory() {
  return JSON.parse(localStorage.getItem('searchHistory') || '[]');
}
function saveSearchHistory(word) {
  word = word.trim();
  if (!word) return;
  let hist = getSearchHistory();
  hist = hist.filter(w => w !== word);
  hist.unshift(word);
  if (hist.length > 10) hist = hist.slice(0, 10);
  localStorage.setItem('searchHistory', JSON.stringify(hist));
}
function renderHistory() {
  const hist = getSearchHistory();
  if (hist.length === 0) {
    historyList.innerHTML = '<div class="empty-tip">暂无搜索历史</div>';
    return;
  }
  let html = '';
  hist.forEach((w, i) => {
    html += `
      <div class="history-item" data-index="${i}">
        <span>${w}</span>
        <span class="history-del" onclick="delHistory(event, ${i})">×</span>
      </div>
    `;
  });
  historyList.innerHTML = html;
}
function showHistory() {
  if (search.value.trim() !== '') return;
  renderHistory();
  historyPanel.classList.add('show');
  hideSuggest();
}
function hideHistory() {
  historyPanel.classList.remove('show');
}
function hideSuggest() {
  suggest.classList.remove('show');
}
function delHistory(e, i) {
  e.stopPropagation();
  let hist = getSearchHistory();
  hist.splice(i, 1);
  localStorage.setItem('searchHistory', JSON.stringify(hist));
  renderHistory();
}
function clearAllHistory() {
  if (!confirm('确定清空所有搜索历史？')) return;
  localStorage.removeItem('searchHistory');
  renderHistory();
}
historyList.addEventListener('click', (e) => {
  const item = e.target.closest('.history-item');
  if (!item) return;
  const word = item.querySelector('span').textContent;
  search.value = word;
  hideHistory();
  searchFn(word);
});

// 联想词
function getSuggest(word) {
  if (!word) {
    hideSuggest();
    showHistory();
    return;
  }
  const s = document.createElement('script');
  window.baiduSuggestCallback = res => {
    let html = '';
    if (res.s && res.s.length > 0) {
      html = res.s.map(i => `<div class="suggest-item">${i}</div>`).join('');
    } else {
      html = '<div class="empty-tip">暂无联想结果</div>';
    }
    suggest.innerHTML = html;
    suggest.classList.add('show');
    hideHistory();
    document.querySelectorAll('.suggest-item').forEach(el => {
      el.onclick = () => {
        search.value = el.textContent;
        hideSuggest();
        searchFn(el.textContent);
      };
    });
    document.body.removeChild(s);
  };
  s.src = `https://suggestion.baidu.com/su?wd=${encodeURIComponent(word)}&cb=baiduSuggestCallback`;
  document.body.appendChild(s);
}
function searchFn(q) {
  q = q.trim();
  if (!q) return;
  saveSearchHistory(q);
  window.open(q.startsWith('http') ? q : `https://www.baidu.com/s?wd=${encodeURIComponent(q)}`);
}

// 搜索框事件
search.addEventListener('input', () => {
  clearTimeout(timer);
  const v = search.value.trim();
  if (v) {
    nav.classList.add('hide');
    timer = setTimeout(() => getSuggest(v), 100);
  } else {
    nav.classList.remove('hide');
    hideSuggest();
    showHistory();
  }
});
search.addEventListener('focus', () => {
  if (!search.value.trim()) showHistory();
});
search.addEventListener('blur', () => {
  setTimeout(() => {
    hideHistory();
    hideSuggest();
  }, 200);
});
search.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    const v = search.value.trim();
    if (v) {
      hideSuggest();
      hideHistory();
      searchFn(v);
    }
  }
});

// 书签功能
function fixUrl(url) {
  if (!url) return '';
  if (!/^https?:\/\//i.test(url)) return 'http://' + url;
  return url;
}
let list = JSON.parse(localStorage.getItem('bookmarks')) || [
  { name: '百度', url: 'https://www.baidu.com' },
  { name: '抖音', url: 'https://www.douyin.com' },
  { name: 'B站', url: 'https://www.bilibili.com' },
  { name: '知乎', url: 'https://www.zhihu.com' }
];
let currentIndex = null;
let isSorting = false;
function render() {
  let html = '';
  list.forEach((it, i) => {
    const t = it.name.charAt(0);
    html += `
      <a class="item" data-index="${i}" href="${it.url}" target="_blank">
        <div class="icon">${t}</div>
        <span>${it.name}</span>
      </a>
    `;
  });
  html += `
    <div class="item add-btn" onclick="openAdd()">
      <div class="icon">+</div>
    </div>
  `;
  nav.innerHTML = html;
  bindLongPress();
}
function bindLongPress() {
  const items = document.querySelectorAll('.item:not(.add-btn)');
  let longTimer;
  items.forEach(el => {
    el.ontouchstart = el.onmousedown = (e) => {
      if (isSorting) return;
      longTimer = setTimeout(() => {
        if (e.type === 'mousedown') e.preventDefault();
        currentIndex = parseInt(el.dataset.index);
        showMenu(el);
      }, 500);
    };
    el.ontouchend = el.onmouseup = () => clearTimeout(longTimer);
    el.onmouseleave = () => clearTimeout(longTimer);
    el.ondragstart = () => false;
  });
}
const menu = document.getElementById('longMenu');
function showMenu(el) {
  const rect = el.getBoundingClientRect();
  menu.style.left = rect.left + 'px';
  menu.style.top = rect.bottom + 8 + 'px';
  menu.classList.add('show');
}
document.addEventListener('click', () => menu.classList.remove('show'));
function startSort() {
  menu.classList.remove('show');
  if (isSorting) return;
  isSorting = true;
  const items = document.querySelectorAll('.item:not(.add-btn)');
  items.forEach(el => {
    el.setAttribute('draggable', true);
    el.classList.add('sorting');
    el.ondragend = () => {
      isSorting = false;
      items.forEach(i => i.classList.remove('sorting'));
      localStorage.setItem('bookmarks', JSON.stringify(list));
      render();
    };
    el.ondragover = e => e.preventDefault();
    el.ondrop = function () {
      const i1 = currentIndex;
      const i2 = parseInt(this.dataset.index);
      [list[i1], list[i2]] = [list[i2], list[i1]];
      render();
    };
    el.ondragstart = () => currentIndex = parseInt(el.dataset.index);
  });
}
const addMask = document.getElementById('addMask');
function openAdd() {
  document.getElementById('addName').value = '';
  document.getElementById('addUrl').value = '';
  addMask.classList.add('show');
}
function closeAdd() { addMask.classList.remove('show'); }
function saveAdd() {
  const name = document.getElementById('addName').value.trim();
  let url = document.getElementById('addUrl').value.trim();
  if (!name || !url) return alert('请填写完整');
  url = fixUrl(url);
  list.push({ name, url });
  localStorage.setItem('bookmarks', JSON.stringify(list));
  render();
  closeAdd();
}
const editMask = document.getElementById('editMask');
function openEdit() {
  menu.classList.remove('show');
  const item = list[currentIndex];
  document.getElementById('editName').value = item.name;
  document.getElementById('editUrl').value = item.url;
  editMask.classList.add('show');
}
function closeEdit() { editMask.classList.remove('show'); }
function saveEdit() {
  const name = document.getElementById('editName').value.trim();
  let url = document.getElementById('editUrl').value.trim();
  if (!name || !url) return alert('请填写完整');
  url = fixUrl(url);
  list[currentIndex] = { name, url };
  localStorage.setItem('bookmarks', JSON.stringify(list));
  render();
  closeEdit();
}
function doDel() {
  menu.classList.remove('show');
  if (!confirm('确定删除？')) return;
  list.splice(currentIndex, 1);
  localStorage.setItem('bookmarks', JSON.stringify(list));
  render();
}

render();
</script>
</body>
</html>

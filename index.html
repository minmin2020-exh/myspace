<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>纯净导航</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }
        body{
            background:#121212;
            color:#fff;
            font-family:system-ui;
            padding:20px;
        }
        .title{
            text-align:center;
            margin:30px 0;
            font-size:22px;
            font-weight:bold;
            color:#f5f5f5;
        }
        .nav-box{
            display:grid;
            grid-template-columns:repeat(3,1fr);
            gap:15px;
            margin-top:20px;
        }
        .item{
            background:#1e1e1e;
            border-radius:12px;
            padding:20px 10px;
            text-align:center;
            font-size:14px;
            color:#eee;
            text-decoration:none;
            transition:0.2s;
            border:1px solid #333;
        }
        .item:active{
            background:#2d2d2d;
            transform:scale(0.96);
        }
        .container{
            max-width:420px;
            margin:0 auto;
        }
        .footer{
            text-align:center;
            margin-top:50px;
            font-size:12px;
            color:#666;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="title">手机纯净导航</div>
        <div class="nav-box">
            <a class="item" href="#">导航1</a>
            <a class="item" href="#">导航2</a>
            <a class="item" href="#">导航3</a>
            <a class="item" href="#">导航4</a>
            <a class="item" href="#">导航5</a>
            <a class="item" href="#">导航6</a>
            <a class="item" href="#">导航7</a>
            <a class="item" href="#">导航8</a>
            <a class="item" href="#">导航9</a>
        </div>
        <div class="footer">纯净导航 · 无广告</div>
    </div>
</body>
</html>
